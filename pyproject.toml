[project]
name = "gws-mcp"
version = "0.1.0"
description = "Local MCP server giving Claude access to multiple Google Workspace accounts (Gmail, Calendar, Drive)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # MCP Python SDK v2 (FastMCP was renamed to MCPServer in v2).
    "mcp>=2.3,<3",
    "google-api-python-client>=2.200",
    "google-auth>=2.60",
    "google-auth-oauthlib>=1.5",
    "requests>=2.32",
    "keyring>=25",
    "cryptography>=45",
    "pydantic>=2.10",
]

[project.scripts]
gws-mcp = "gws_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gws_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # fake tokens in tests
